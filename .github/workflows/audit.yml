name: Audit docs vs source

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Source branch to audit against (AI-Implement and skills)'
                type: choice
                options:
                    - main
                    - testing
                default: main
            max_turns:
                description: 'Override max-turns (blank = branch default: 120 main / 140 testing)'
                type: string
                required: false
                default: ''
            docs_branch:
                description: 'Docs branch/ref to audit (blank = the dispatch ref, typically main)'
                type: string
                required: false
                default: ''
                    
# strip out the default GITHUB_TOKEN scope, secrets pass through to the reusable workflow
permissions: {}

jobs:
    audit:
        uses: ./.github/workflows/_audit-job.yml
        with:
            target_branch: ${{ github.event.inputs.branch || 'testing' }}
            docs_branch: ${{ github.event.inputs.docs_branch || github.ref_name }}
            max_turns: ${{ github.event.inputs.max_turns != '' && github.event.inputs.max_turns || ((github.event.inputs.branch || 'testing') == 'main' && '120' || '140') }}
            artifact_name: audit-output
        secrets:
            app_client_id: ${{ secrets.DOCS_AUDIT_APP_CLIENT_ID }}
            app_private_key: ${{ secrets.DOCS_AUDIT_APP_PRIVATE_KEY }}
            claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    
    open-pr:
        needs: audit
        if: always()
        runs-on: ubuntu-latest

        env:
            TARGET_BRANCH: ${{ github.event.inputs.branch || 'testing' }}

        steps:
            - name: Mint GitHub App installation token (for PR creation)
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                client-id: ${{ secrets.DOCS_AUDIT_APP_CLIENT_ID }}
                private-key: ${{ secrets.DOCS_AUDIT_APP_PRIVATE_KEY }}
                owner: BuildDownAI
                repositories: docs

            - name: Checkout docs repo
              uses: actions/checkout@v6
              with:
                ref: ${{ github.event.inputs.docs_branch || github.ref_name }}
                token: ${{ steps.app-token.outputs.token }}

            - name: Download audit artifact
              uses: actions/download-artifact@v8
              with:
                name: audit-output

            - name: Open audit PR
              uses: peter-evans/create-pull-request@v8
              with:
                token: ${{ steps.app-token.outputs.token }}
                branch: audit/${{ github.run_id }}
                base: ${{ github.event.inputs.docs_branch || github.ref_name }}
                title: "Docs audit: sources on ${{ env.TARGET_BRANCH }}"
                body-path: audit-report.md
                draft: true
                labels: docs-audit
                delete-branch: true
                add-paths: |
                    **/*.mdx