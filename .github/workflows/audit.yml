name: Audit docs vs source

on:
    workflow_dispatch:
        inputs:
            scope:
                description: 'Which docs version to audit'
                type: choice
                options:
                    - stable
                    - latest
                default: stable
            ai_implement_ref:
                description: 'Override the AI-Implement ref (blank = latest release, or testing for scope=latest)'
                type: string
                required: false
                default: ''
            skills_ref:
                description: 'Override the skills ref (blank = latest release, or testing for scope=latest)'
                type: string
                required: false
                default: ''
            max_turns:
                description: 'Override max-turns (blank = 140)'
                type: string
                required: false
                default: ''
                    
# strip out the default GITHUB_TOKEN scope, secrets pass through to the reusable workflow
permissions: {}

jobs:
    resolve-refs:
        uses: ./.github/workflows/_resolve-refs.yml
        with:
            scope: ${{ github.event.inputs.scope }}
            ai_implement_ref: ${{ github.event.inputs.ai_implement_ref }}
            skills_ref: ${{ github.event.inputs.skills_ref }}

    audit:
        needs: resolve-refs
        uses: ./.github/workflows/_audit-job.yml
        with:
            ai_implement_ref: ${{ needs.resolve-refs.outputs.ai_implement_ref }}
            skills_ref: ${{ needs.resolve-refs.outputs.skills_ref }}
            docs_scope: ${{ github.event.inputs.scope }}
            docs_branch: ${{ github.ref_name }}
            max_turns: ${{ github.event.inputs.max_turns != '' && github.event.inputs.max_turns || '140' }}
            artifact_name: audit-output
    
    open-pr:
        needs: [audit, resolve-refs]
        if: always()
        runs-on: ubuntu-latest

        env:
            DOCS_SCOPE: ${{ github.event.inputs.scope }}
            AI_IMPLEMENT_REF: ${{ needs.resolve-refs.outputs.ai_implement_ref }}
            SKILLS_REF: ${{ needs.resolve-refs.outputs.skills_ref }}

        steps:
            - name: Mint GitHub App installation token (for PR creation)
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                client-id: ${{ secrets.DOCS_AUDIT_APP_CLIENT_ID }}
                private-key: ${{ secrets.DOCS_AUDIT_APP_PRIVATE_KEY }}
                owner: BuildDownAI
                repositories: docs

            - name: Checkout docs repo
              uses: actions/checkout@v6
              with:
                ref: ${{ github.ref_name }}
                token: ${{ steps.app-token.outputs.token }}

            - name: Download audit artifact
              uses: actions/download-artifact@v8
              with:
                name: audit-output

            - name: Open audit PR
              uses: peter-evans/create-pull-request@v8
              with:
                token: ${{ steps.app-token.outputs.token }}
                branch: audit/${{ github.run_id }}
                base: ${{ github.ref_name }}
                title: "Docs audit (${{ env.DOCS_SCOPE }}): AI-Implement ${{ env.AI_IMPLEMENT_REF }}, skills ${{ env.SKILLS_REF }}"
                body-path: audit-report.md
                draft: true
                labels: docs-audit
                delete-branch: true
                # `*.mdx` not `**/*.mdx` — git pathspec requires a literal directory component for the
                # latter, so `**/*.mdx` silently drops every root-level page, which is all of stable's
                # top-level tree. `*` matches `/` here, so this still reaches nested pages.
                add-paths: |
                    *.mdx