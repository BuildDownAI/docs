name: Audit job (reusable)

on:
    workflow_call:
        inputs:
            target_branch:
                description: 'Source branch to audit against (AI-Implement and skills)'
                required: true
                type: string
            docs_branch:
                description: 'Docs branch/ref to audit'
                required: true
                type: string
            max_turns:
                description: 'Max turns for the audit Claude invocation'
                required: true
                type: string
            artifact_name:
                description: 'Name for the uploaded artifact (must be unique per matrix instance when called from a matrix job)'
                required: true
                type: string
        secrets:
            app_client_id:
                required: true
            app_private_key:
                required: true
            claude_oauth_token:
                required: true

jobs:
    audit:
        runs-on: ubuntu-latest

        steps:
            - name: Mint GitHub App installation token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                client-id: ${{ secrets.app_client_id }}
                private-key: ${{ secrets.app_private_key }}
                owner: BuildDownAI
                repositories: docs,AI-Implement,skills

            - name: Checkout docs repo
              uses: actions/checkout@v6
              with:
                ref: ${{ inputs.docs_branch }}
                token: ${{ steps.app-token.outputs.token }}

            - name: Checkout target branch of AI-Implement
              uses: actions/checkout@v6
              with:
                repository: BuildDownAI/AI-Implement
                ref: ${{ inputs.target_branch }}
                path: ai-implement
                token: ${{ steps.app-token.outputs.token }}

            - name: Checkout target branch of skills
              uses: actions/checkout@v6
              with:
                repository: BuildDownAI/skills
                ref: ${{ inputs.target_branch }}
                path: skills-source
                token: ${{ steps.app-token.outputs.token }}

            - name: Install Claude Code CLI
              timeout-minutes: 3
              run: |
                npm install -g @anthropic-ai/claude-code
                claude --version

            # the agent is a separate process — workflow inputs reach it only via the filesystem
            - name: Record audit target for the prompt
              env:
                TARGET_BRANCH: ${{ inputs.target_branch }}
              run: echo "$TARGET_BRANCH" > .audit-target-branch

            - name: Run audit
              timeout-minutes: 45
              continue-on-error: true
              env:
                CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_oauth_token }}
                MAX_TURNS: ${{ inputs.max_turns }}
              run: |
                claude -p "$(cat .github/audit-prompt.md)" \
                    --max-turns "$MAX_TURNS" \
                    --permission-mode acceptEdits \
                    --output-format stream-json --verbose > claude-stream.jsonl

            - name: Report run telemetry
              if: always()
              shell: bash
              env:
                MAX_TURNS: ${{ inputs.max_turns }}
                TARGET_BRANCH: ${{ inputs.target_branch }}
              run: |
                if [ ! -s claude-stream.jsonl ]; then
                  echo "### Audit run — no telemetry stream produced" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                # the terminal result event carries every field the json envelope did
                jq -c 'select(.type=="result")' claude-stream.jsonl | tail -1 > claude-envelope.json
                [ -s claude-envelope.json ] || echo '{}' > claude-envelope.json
                # one API response per distinct assistant message id, MAIN LOOP ONLY — subagent
                # responses carry a parent_tool_use_id and are not what --max-turns bounds
                agentic=$(jq -r 'select(.type=="assistant" and (.parent_tool_use_id // null) == null) | .message.id' claude-stream.jsonl | sort -u | wc -l)
                delegated=$(jq -r 'select(.type=="assistant" and (.parent_tool_use_id // null) != null) | .message.id' claude-stream.jsonl | sort -u | wc -l)
                turns=$(jq -r '.num_turns // "unknown"' claude-envelope.json)
                outcome=$(jq -r '.subtype // "unknown"' claude-envelope.json)
                {
                  echo "### Audit run — ${TARGET_BRANCH}"
                  echo ""
                  echo "| Metric | Value |"
                  echo "|---|---|"
                  echo "| Outcome | ${outcome} |"
                  echo "| Agentic turns used | ${agentic} of ${MAX_TURNS} |"
                  echo "| Subagent turns (uncapped) | ${delegated} |"
                  echo "| Tool results (num_turns) | ${turns} |"
                } >> "$GITHUB_STEP_SUMMARY"
                if [ "$outcome" = "error_max_turns" ]; then
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "⚠️ **Turn cap reached** — this run was truncated. Raise \`max_turns\` and re-run." >> "$GITHUB_STEP_SUMMARY"
                fi

            - name: Stage changed files for artifact
              if: always()
              shell: bash
              run: |
                mkdir -p artifact-staging
                # audit-report.md is untracked; git diff won't catch it
                [ -f audit-report.md ] && cp audit-report.md artifact-staging/
                [ -f claude-envelope.json ] && cp claude-envelope.json artifact-staging/
                [ -f claude-stream.jsonl ] && gzip -c claude-stream.jsonl > artifact-staging/claude-stream.jsonl.gz
                # MDX edits are in tracked files; capture only what the audit actually changed
                git diff --name-only HEAD -- '*.mdx' | while read -r f; do
                    case "$f" in
                        ai-implement/*|skills-source/*) continue ;;
                    esac
                    [ -f "$f" ] && cp --parents "$f" artifact-staging/
                done
                echo "=== Staged artifact contents ==="
                find artifact-staging -type f | sort

            - name: Upload audit artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: ${{ inputs.artifact_name }}
                path: artifact-staging/
                retention-days: 7
                if-no-files-found: warn