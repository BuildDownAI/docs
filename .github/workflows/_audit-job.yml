name: Audit job (reusable)

on:
    workflow_call:
        inputs:
            target_branch:
                description: 'AI-Implement branch to audit against'
                required: true
                type: string
            docs_branch:
                description: 'Docs branch/ref to audit'
                required: true
                type: string
            max_turns:
                description: 'Max turns for the audit Claude invocation'
                required: true
                type: string
            artifact_name:
                description: 'Name for the uploaded artifact (must be unique per matrix instance when called from a matrix job)'
                required: true
                type: string
        secrets:
            app_client_id:
                required: true
            app_private_key:
                required: true
            claude_oauth_token:
                required: true

jobs:
    audit:
        runs-on: ubuntu-latest

        steps:
            - name: Mint GitHub App installation token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                client-id: ${{ secrets.app_client_id }}
                private-key: ${{ secrets.app_private_key }}
                owner: BuildDownAI
                repositories: docs,AI-Implement

            - name: Checkout docs repo
              uses: actions/checkout@v6
              with:
                ref: ${{ inputs.docs_branch }}
                token: ${{ steps.app-token.outputs.token }}

            - name: Checkout target branch of AI-Implement
              uses: actions/checkout@v6
              with:
                repository: BuildDownAI/AI-Implement
                ref: ${{ inputs.target_branch }}
                path: ai-implement
                token: ${{ steps.app-token.outputs.token }}

            - name: Install Claude Code CLI
              timeout-minutes: 3
              run: |
                npm install -g @anthropic-ai/claude-code
                claude --version

            - name: Run audit
              timeout-minutes: 45
              continue-on-error: true
              env:
                CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.claude_oauth_token }}
              run: |
                claude -p "$(cat .github/audit-prompt.md)" \
                    --max-turns "${{ inputs.max_turns }}" \
                    --permission-mode acceptEdits

            - name: Stage changed files for artifact
              if: always()
              shell: bash
              run: |
                mkdir -p artifact-staging
                # audit-report.md is untracked; git diff won't catch it
                [ -f audit-report.md ] && cp audit-report.md artifact-staging/
                # MDX edits are in tracked files; capture only what the audit actually changed
                git diff --name-only HEAD -- '*.mdx' | while read -r f; do
                    case "$f" in
                        ai-implement/*) continue ;;
                    esac
                    if [ -f "$f" ]; then
                        mkdir -p "artifact-staging/$(dirname "$f")"
                        cp "$f" "artifact-staging/$f"
                    fi
                done
                echo "=== Staged artifact contents ==="
                find artifact-staging -type f | sort

            - name: Upload audit artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: ${{ inputs.artifact_name }}
                path: artifact-staging/
                retention-days: 7
                if-no-files-found: warn