name: Audit AI-Implement docs vs source (multi-run synthesis)

on:
    schedule:
        # Monthly: 1st of each month at 15:00 UTC.
        - cron: '0 15 1 * *'
    workflow_dispatch:
        inputs:
            runs:
                description: 'Number of parallel audit runs to synthesize (default 3)'
                type: choice
                options:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '5'
                default: '3'
            branch:
                description: 'AI-Implement branch to audit against'
                type: choice
                options:
                    - main
                    - testing
                default: main
            docs_branch:
                description: 'Docs branch/ref to audit (blank = the dispatch ref, typically main)'
                type: string
                required: false
                default: ''
            max_turns:
                description: 'Override max-turns (blank = branch default: 75 main / 100 testing)'
                type: string
                required: false
                default: ''

# strip out the default GITHUB_TOKEN scope, our own App token is minted in audit-runs
permissions: {}

jobs:
    generate-matrix:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.gen.outputs.matrix }}
        steps:
            - id: gen
              name: Build dynamic matrix from runs input
              run: |
                # Default to 3 for scheduled runs (no inputs provided)
                N="${{ github.event.inputs.runs || '3' }}"
                IDS=$(seq 1 "$N" | jq -R -s -c 'split("\n") | map(select(length > 0) | tonumber)')
                MATRIX_JSON="{\"run_id\":$IDS}"
                echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
                echo "Generated matrix for N=$N: $MATRIX_JSON"
    
    audit-runs:
        needs: generate-matrix
        runs-on: ubuntu-latest
        strategy:
            matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
            fail-fast: false
        steps:
            - name: Step 1 placeholder
              run: |
                echo "Run ${{ matrix.run_id }} placeholder"
                echo "Real audit steps land in Step 2"