name: Audit docs vs source (multi-run synthesis)

on:
    schedule:
        # Bi-weekly: 1st and 15th of each month at 15:00 UTC.
        - cron: '0 15 1,15 * *'
    workflow_dispatch:
        inputs:
            runs:
                description: 'Number of parallel audit runs to synthesize (default 3)'
                type: choice
                options:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '5'
                default: '3'
            branch:
                description: 'Source branch to audit against (AI-Implement and skills)'
                type: choice
                options:
                    - main
                    - testing
                default: main
            max_turns:
                description: 'Override max-turns (blank = 140)'
                type: string
                required: false
                default: ''
            synthesis_max_turns:
                description: 'Override synthesis max-turns (blank = 200)'
                type: string
                required: false
                default: ''
            docs_branch:
                description: 'Docs branch/ref to audit (blank = the dispatch ref, typically main)'
                type: string
                required: false
                default: ''
                  
# strip out the default GITHUB_TOKEN scope, our own App token is minted in audit-runs
permissions: {}

jobs:
    generate-matrix:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.gen.outputs.matrix }}
        steps:
            - id: gen
              name: Build dynamic matrix from runs input
              env:
                RUNS: ${{ github.event.inputs.runs || '3' }}
              run: |
                # Default to 3 for scheduled runs (no inputs provided)
                N="$RUNS"
                IDS=$(seq 1 "$N" | jq -R -s -c 'split("\n") | map(select(length > 0) | tonumber)')
                MATRIX_JSON="{\"run_id\":$IDS}"
                echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
                echo "Generated matrix for N=$N: $MATRIX_JSON"
    
    audit-runs:
        needs: generate-matrix
        strategy:
            matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
            fail-fast: false
        uses: ./.github/workflows/_audit-job.yml
        with:
            target_branch: ${{ github.event.inputs.branch || 'testing' }}
            docs_branch: ${{ github.event.inputs.docs_branch || github.ref_name }}
            max_turns: ${{ github.event.inputs.max_turns != '' && github.event.inputs.max_turns || '140' }}
            artifact_name: audit-run-${{ matrix.run_id }}
        secrets:
            app_client_id: ${{ secrets.DOCS_AUDIT_APP_CLIENT_ID }}
            app_private_key: ${{ secrets.DOCS_AUDIT_APP_PRIVATE_KEY }}
            claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    synthesis:
        needs: audit-runs
        if: always() # run even if some matrix jobs failed to handle partial inputs
        runs-on: ubuntu-latest

        env:
            TARGET_BRANCH: ${{ github.event.inputs.branch || 'testing' }}
            EXPECTED_RUNS: ${{ github.event.inputs.runs || '3' }}
            SYNTHESIS_MAX_TURNS: ${{ github.event.inputs.synthesis_max_turns != '' && github.event.inputs.synthesis_max_turns || '200' }}

        steps:
            - name: Mint GitHub App installation token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                client-id: ${{ secrets.DOCS_AUDIT_APP_CLIENT_ID }}
                private-key: ${{ secrets.DOCS_AUDIT_APP_PRIVATE_KEY }}
                owner: BuildDownAI
                repositories: docs,AI-Implement,skills

            - name: Checkout docs repo (fresh working tree — no audit edits applied)
              uses: actions/checkout@v6
              with:
                ref: ${{ github.event.inputs.docs_branch || github.ref_name }}
                token: ${{ steps.app-token.outputs.token }}

            - name: Checkout target branch of AI-Implement
              uses: actions/checkout@v6
              with:
                repository: BuildDownAI/AI-Implement
                ref: ${{ env.TARGET_BRANCH }}
                path: ai-implement
                token: ${{ steps.app-token.outputs.token }}

            - name: Checkout target branch of skills
              uses: actions/checkout@v6
              with:
                repository: BuildDownAI/skills
                ref: ${{ env.TARGET_BRANCH }}
                path: skills-source
                token: ${{ steps.app-token.outputs.token }}

            - name: Download all audit-run artifacts
              uses: actions/download-artifact@v8
              with:
                pattern: audit-run-*
                path: audit-runs/
                # merge-multiple: false (default) — each artifact in its own subdir

            - name: Rename artifact dirs (audit-run-N → run-N) for cleaner synthesis paths
              run: |
                cd audit-runs
                for d in audit-run-*; do
                    mv "$d" "run-${d#audit-run-}"
                done
                ls -la

            - name: Record expected-runs count for synthesis
              run: |
                mkdir -p audit-runs
                echo "$EXPECTED_RUNS" > audit-runs/.expected-runs

            - name: Install Claude Code CLI
              timeout-minutes: 3
              run: |
                npm install -g @anthropic-ai/claude-code
                claude --version

            - name: Run synthesis
              timeout-minutes: 45
              continue-on-error: true
              env:
                CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
              run: |
                claude -p "$(cat .github/synthesis-prompt.md)" \
                    --max-turns "$SYNTHESIS_MAX_TURNS" \
                    --permission-mode acceptEdits \
                    --output-format stream-json --verbose > claude-stream.jsonl

            - name: Report run telemetry
              id: telemetry
              if: always()
              shell: bash
              run: |
                # the PR step consumes this — a missing report means there is nothing to open
                if [ -s audit-report.md ]; then
                  echo "report=true" >> "$GITHUB_OUTPUT"
                else
                  echo "report=false" >> "$GITHUB_OUTPUT"
                fi
                if [ ! -s claude-stream.jsonl ]; then
                  echo "### Synthesis — no telemetry stream produced" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                jq -c 'select(.type=="result")' claude-stream.jsonl | tail -1 > claude-envelope.json
                [ -s claude-envelope.json ] || echo '{}' > claude-envelope.json
                # main loop only — subagent responses carry a parent_tool_use_id and are not capped
                agentic=$(jq -r 'select(.type=="assistant" and (.parent_tool_use_id // null) == null) | .message.id' claude-stream.jsonl | sort -u | wc -l)
                delegated=$(jq -r 'select(.type=="assistant" and (.parent_tool_use_id // null) != null) | .message.id' claude-stream.jsonl | sort -u | wc -l)
                turns=$(jq -r '.num_turns // "unknown"' claude-envelope.json)
                outcome=$(jq -r '.subtype // "unknown"' claude-envelope.json)
                {
                  echo "### Synthesis — ${TARGET_BRANCH}"
                  echo ""
                  echo "| Metric | Value |"
                  echo "|---|---|"
                  echo "| Outcome | ${outcome} |"
                  echo "| Agentic turns used | ${agentic} of ${SYNTHESIS_MAX_TURNS} |"
                  echo "| Subagent turns (uncapped) | ${delegated} |"
                  echo "| Tool results (num_turns) | ${turns} |"
                } >> "$GITHUB_STEP_SUMMARY"
                if [ "$outcome" = "error_max_turns" ]; then
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "⚠️ **Turn cap reached** — this run was truncated. Raise \`synthesis_max_turns\` and re-run." >> "$GITHUB_STEP_SUMMARY"
                fi
                if [ ! -s audit-report.md ]; then
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "❌ **No synthesis report produced** — \`audit-report.md\` is missing, so no pull request was opened. The outcome above is the reason." >> "$GITHUB_STEP_SUMMARY"
                fi

            - name: Archive synthesis report (keep newest 5)
              if: always()
              shell: bash
              run: |
                mkdir -p .github/audit-archive
                if [ -f audit-report.md ]; then
                    cp audit-report.md ".github/audit-archive/synthesis-$(date -u +%F)-${{ github.run_id }}.md"
                fi
                # date-prefixed filenames sort chronologically; drop everything past the newest 5
                ls -1 .github/audit-archive/synthesis-*.md 2>/dev/null | sort | head -n -5 | xargs -r rm --
                echo "=== Archive contents ==="
                ls -1 .github/audit-archive/

            - name: Open synthesis PR
              # open PR even if synthesis partially completed — but only if it produced a report,
              # otherwise create-pull-request fails on the missing body-path and buries the real cause
              if: always() && steps.telemetry.outputs.report == 'true'
              uses: peter-evans/create-pull-request@v8
              with:
                token: ${{ steps.app-token.outputs.token }}
                branch: audit-multi/${{ github.run_id }}
                base: ${{ github.event.inputs.docs_branch || github.ref_name }}
                title: "Docs audit (multi-run synthesis): sources on ${{ env.TARGET_BRANCH }}"
                body-path: audit-report.md
                draft: true
                labels: docs-audit,docs-audit-multi
                delete-branch: true
                # `*.mdx` not `**/*.mdx` — git pathspec requires a literal directory component for the
                # latter, so `**/*.mdx` silently drops every root-level page, which is all of stable's
                # top-level tree. `*` matches `/` here, so this still reaches nested pages.
                add-paths: |
                    *.mdx
                    .github/audit-archive/**
                    :!audit-runs/**
                    :!ai-implement/**
                    :!skills-source/**

            # without this a failed synthesis leaves nothing to diagnose — the stream is the only
            # record of where the turns went, and the runner is torn down with it
            - name: Upload synthesis telemetry
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: synthesis-telemetry
                path: |
                    claude-stream.jsonl
                    audit-report.md
                retention-days: 7
                if-no-files-found: warn

            # the synthesis step is continue-on-error so partial output still reaches a PR; without
            # this the job goes green when synthesis produced nothing at all
            - name: Fail if synthesis produced no report
              if: always() && steps.telemetry.outputs.report != 'true'
              run: |
                echo "::error::Synthesis produced no audit-report.md. See the run telemetry in the job summary for the outcome."
                exit 1